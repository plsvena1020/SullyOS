<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google 授权</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0f1115; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1a1d24; border: 1px solid #2d323c; border-radius: 16px; padding: 28px; max-width: 420px; width: 100%; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0; }
    .err { color: #f87171; }
    .ok { color: #4ade80; }
    code { display: block; background: #0f1115; border: 1px solid #2d323c; border-radius: 8px; padding: 10px;
           font-family: ui-monospace, monospace; font-size: 11px; color: #7dd3fc; word-break: break-all;
           margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Google 授权</h1>
    <p id="hint">正在完成连接…</p>
    <code id="detail" style="display:none"></code>
  </div>
  <script>
    (function () {
      var title = document.getElementById('title');
      var hint = document.getElementById('hint');
      var detail = document.getElementById('detail');

      function fail(msg, raw) {
        title.textContent = '连接失败';
        hint.innerHTML = '<span class="err">' + msg + '</span><br>可以关掉本页，回到小手机设置页重试。';
        if (raw) { detail.textContent = raw; detail.style.display = 'block'; }
        notify('error', msg);
      }
      function notify(type, message, accountId, email) {
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(
              { source: 'google-oauth-callback', type: type, message: message, accountId: accountId, email: email },
              window.location.origin
            );
          }
        } catch (e) { /* 跨域时忽略：用户会看到本页结果 */ }
      }

      var params = new URLSearchParams(location.search);
      var code = params.get('code');
      var err = params.get('error');

      if (err) {
        fail('Google 返回：' + err);
        return;
      }
      if (!code) {
        fail('地址栏里没有授权码（code 为空）');
        return;
      }

      // 桥地址与 token 从 localStorage 读（同源，localhost:5173 与设置页一致）
      var bridgeUrl = '';
      var bridgeToken = '';
      try {
        bridgeUrl = (localStorage.getItem('aetheros.google.bridgeUrl') || '').replace(/\/+$/, '');
        bridgeToken = localStorage.getItem('aetheros.google.bridgeToken') || '';
      } catch (e) { /* ignore */ }

      if (!bridgeUrl || !bridgeToken) {
        fail('还没填桥地址或桥 Token', '请回到小手机设置页的「连接 Google」区块填好后重试');
        return;
      }

      hint.textContent = '正在用授权码换 token…';
      fetch(bridgeUrl + '/api/accounts/exchange', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Google-Bridge-Token': bridgeToken },
        body: JSON.stringify({ code: code }),
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            return { ok: res.ok, status: res.status, body: body };
          });
        })
        .then(function (r) {
          if (!r.ok) {
            var reason = (r.body && (r.body.reason || r.body.error)) || ('HTTP ' + r.status);
            fail('桥返回：' + reason, r.body && r.body.error === 'exchange failed' ? '通常是回调地址不一致：请确认 Google 后台登记的 URI 与本机地址完全相同（含 http/https、端口、.html 后缀）' : null);
            return;
          }
          // 清掉一次性 code，避免刷新本页重复交换
          try { localStorage.removeItem('aetheros.google.pendingCode'); } catch (e) {}
          var email = r.body && r.body.email;
          title.textContent = '连接成功';
          hint.innerHTML = '<span class="ok">已连接 ' + (email || '') + '</span><br>这个窗口可以关掉了，小手机那边已经自动更新。';
          notify('success', '已连接 ' + (email || ''), r.body && r.body.accountId, email);
          setTimeout(function () { window.close(); }, 1200);
        })
        .catch(function (e) {
          fail('网络错误：' + (e && e.message ? e.message : e));
        });
    })();
  </script>
</body>
</html>
